name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The Testcontainers PostgreSQL suite needs a Docker daemon, which ubuntu-latest
  # provides. Unlike the local scripts, CI therefore runs the integration tests too
  # instead of filtering them out.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore fakebookPayment.Tests/fakebookPayment.Tests.csproj

      - name: Build
        run: dotnet build fakebookPayment.Tests/fakebookPayment.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test fakebookPayment.Tests/fakebookPayment.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
